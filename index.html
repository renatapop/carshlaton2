<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Carshalton Departures</title>
  <meta name="description" content="A tablet-friendly Carshalton departures board draft.">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23fbfbfa'/%3E%3Cpath d='M17 16h30a5 5 0 0 1 5 5v19a6 6 0 0 1-6 6H18a6 6 0 0 1-6-6V21a5 5 0 0 1 5-5Z' fill='%23040457'/%3E%3Cpath d='M20 23h24v6H20zM20 34h13v5H20zM38 34h6v5h-6z' fill='%23fbfbfa'/%3E%3Cpath d='M22 48l-5 8M42 48l5 8' stroke='%23040457' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: dark;
      --bg: #000000;
      --panel: #05070d;
      --panel-soft: #09111c;
      --row: #03060b;
      --line: rgba(0, 229, 255, 0.22);
      --line-strong: rgba(255, 42, 213, 0.38);
      --text: #f7fbff;
      --muted: #94a8ba;
      --dim: #596879;
      --blue: #040457;
      --blue-strong: #040457;
      --blue-soft: #8fb5c8;
      --neon-cyan: #00e5ff;
      --neon-pink: #ff2ad5;
      --neon-violet: #8b5cff;
      --board-blue: #00e5ff;
      --board-amber: #ffe66d;
      --green: #3e8266;
      --red: #ff4f7b;
      --ink: #f7fbff;
      --radius: 8px;
      --shadow: 0 18px 46px rgba(0, 0, 0, 0.62), 0 0 24px rgba(0, 229, 255, 0.06);
      --display-font: "Barlow Condensed", "Arial Narrow", "Helvetica Neue Condensed", ui-sans-serif, system-ui, sans-serif;
      --body-font: Inter, Avenir Next, Avenir, "Segoe UI", ui-sans-serif, system-ui, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
    }

    body {
      margin: 0;
      color: var(--text);
      background: #000000;
      font-family: var(--body-font);
      letter-spacing: 0;
    }

    button {
      font: inherit;
    }

    .app {
      width: min(1180px, 100%);
      min-height: 100vh;
      margin: 0 auto;
      padding: clamp(18px, 3vw, 34px);
      display: grid;
      grid-template-rows: auto auto 1fr auto;
      gap: clamp(14px, 2vw, 22px);
    }

    .topbar {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: start;
      gap: 18px;
    }

    .station {
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 0;
    }

    .rail-mark {
      width: clamp(76px, 9vw, 92px);
      height: clamp(76px, 9vw, 92px);
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      border: 1px solid var(--line-strong);
      border-radius: 14px;
      background: #03060b;
      color: var(--board-blue);
      overflow: hidden;
      box-shadow: 0 14px 36px rgba(0, 0, 0, 0.62), 0 0 22px rgba(255, 42, 213, 0.18);
    }

    .rail-mark img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
    }

    h1 {
      margin: 0;
      font-family: var(--display-font);
      font-size: clamp(2.15rem, 5.4vw, 4.5rem);
      line-height: 0.92;
      font-weight: 600;
      text-transform: none;
      color: var(--text);
      text-shadow: 0 0 18px rgba(0, 229, 255, 0.22);
    }

    .code {
      margin-top: 8px;
      color: var(--muted);
      font-family: var(--display-font);
      font-size: clamp(1.05rem, 2.2vw, 1.38rem);
      line-height: 1;
      font-weight: 600;
      text-transform: none;
      text-shadow: 0 0 12px rgba(0, 229, 255, 0.15);
    }

    .clock {
      min-width: clamp(180px, 24vw, 260px);
      padding: 12px 14px 14px;
      border: 1px solid rgba(255, 42, 213, 0.36);
      border-radius: var(--radius);
      background:
        linear-gradient(180deg, rgba(0, 229, 255, 0.08), transparent 48%),
        #03060b;
      box-shadow: 0 14px 34px rgba(0, 0, 0, 0.52), 0 0 22px rgba(255, 42, 213, 0.14);
      text-align: right;
    }

    .time {
      font-family: var(--display-font);
      font-variant-numeric: tabular-nums;
      font-size: clamp(3.35rem, 8.3vw, 6.2rem);
      line-height: 0.78;
      font-weight: 600;
      color: var(--board-amber);
      text-shadow: 0 0 10px rgba(255, 230, 109, 0.48), 0 0 30px rgba(0, 229, 255, 0.16);
    }

    .date {
      margin-top: 10px;
      color: var(--neon-cyan);
      font-family: var(--display-font);
      font-size: clamp(1rem, 1.9vw, 1.22rem);
      line-height: 1;
      font-weight: 600;
      text-transform: none;
      text-shadow: 0 0 12px rgba(0, 229, 255, 0.24);
    }

    .refresh-button {
      margin-top: 12px;
      min-height: 34px;
      padding: 0 14px;
      border: 1px solid rgba(0, 229, 255, 0.36);
      border-radius: 999px;
      color: var(--text);
      background: rgba(0, 229, 255, 0.08);
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.28), 0 0 16px rgba(0, 229, 255, 0.12);
      cursor: pointer;
      font-family: var(--display-font);
      font-size: 1.02rem;
      line-height: 1;
      font-weight: 600;
      transition: transform 160ms ease, border-color 160ms ease, background 160ms ease;
    }

    .refresh-button:hover {
      border-color: rgba(255, 42, 213, 0.54);
      background: rgba(255, 42, 213, 0.12);
      transform: translateY(-1px);
    }

    .refresh-button:disabled {
      cursor: wait;
      opacity: 0.62;
      transform: none;
    }

    .switcher {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      padding: 6px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #03060b;
      box-shadow: var(--shadow);
    }

    .switcher button {
      min-height: 52px;
      border: 0;
      border-radius: 6px;
      color: var(--muted);
      background: transparent;
      cursor: pointer;
      font-family: var(--display-font);
      font-size: clamp(1.22rem, 2.7vw, 1.55rem);
      font-weight: 600;
      text-transform: none;
      transition: background 180ms ease, color 180ms ease, transform 180ms ease;
    }

    .switcher button:hover {
      color: var(--text);
      background: rgba(0, 229, 255, 0.08);
    }

    .switcher button[aria-selected="true"] {
      color: #000000;
      background: linear-gradient(90deg, var(--neon-cyan), var(--neon-pink));
      box-shadow: 0 0 24px rgba(0, 229, 255, 0.24), 0 0 18px rgba(255, 42, 213, 0.18);
    }

    .view {
      display: none;
    }

    .view.active {
      display: grid;
      gap: clamp(14px, 2vw, 20px);
    }

    .section-head {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 16px;
      padding-top: 2px;
    }

    .section-head h2 {
      margin: 0;
      font-family: var(--display-font);
      font-size: clamp(1.48rem, 3.2vw, 2.05rem);
      line-height: 0.98;
      font-weight: 600;
      text-transform: none;
    }

    .updated {
      color: var(--muted);
      font-family: var(--display-font);
      font-size: clamp(1rem, 1.9vw, 1.2rem);
      font-weight: 600;
      text-transform: none;
      white-space: nowrap;
    }

    .notice-stack {
      display: grid;
      gap: 8px;
    }

    .notice {
      display: block;
      gap: 12px;
      min-height: 44px;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #03060b;
      color: var(--text);
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.44), 0 0 18px rgba(0, 229, 255, 0.05);
      font-size: clamp(0.9rem, 1.7vw, 1rem);
      font-weight: 620;
    }

    .notice strong {
      color: var(--board-amber);
      font-weight: 700;
    }

    .notice a {
      display: block;
      width: fit-content;
      margin-top: 6px;
      color: var(--board-blue);
      font-weight: 500;
      text-decoration: underline;
      text-decoration-thickness: 1px;
      text-underline-offset: 3px;
    }

    .notice.warn {
      border-color: rgba(255, 230, 109, 0.38);
      background: rgba(255, 230, 109, 0.08);
      color: #ffe0a1;
    }

    .notice.severe {
      border-color: rgba(255, 79, 123, 0.48);
      background: rgba(255, 79, 123, 0.12);
      color: var(--red);
    }

    .notice.good {
      border-color: rgba(47, 255, 166, 0.24);
      background: rgba(47, 255, 166, 0.08);
      color: #7dffc7;
    }

    .notice.muted {
      color: var(--muted);
      background: #03060b;
    }

    .notice.is-hidden {
      display: none;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: clamp(12px, 2vw, 18px);
    }

    .board-state {
      grid-column: 1 / -1;
      min-height: 220px;
      display: grid;
      place-items: center;
      gap: 14px;
      padding: clamp(24px, 5vw, 44px);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #03060b;
      box-shadow: var(--shadow);
      text-align: center;
    }

    .loading-cog {
      width: 52px;
      height: 52px;
      border: 5px solid rgba(0, 229, 255, 0.14);
      border-top-color: var(--board-blue);
      border-radius: 50%;
      animation: spin 900ms linear infinite;
    }

    .state-title {
      color: var(--board-amber);
      font-size: clamp(1.15rem, 2.5vw, 1.55rem);
      font-weight: 650;
    }

    .state-copy {
      max-width: 420px;
      color: var(--muted);
      font-size: 0.95rem;
      font-weight: 560;
      line-height: 1.45;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .route-card,
    .return-card {
      position: relative;
      overflow: hidden;
      min-width: 0;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background:
        linear-gradient(180deg, rgba(0, 229, 255, 0.07), transparent 34%),
        linear-gradient(90deg, rgba(255, 42, 213, 0.08), transparent 26%),
        #03060b;
      box-shadow: var(--shadow);
    }

    .route-card::before,
    .return-card::before {
      content: "";
      position: absolute;
      inset: 0 0 auto;
      height: 4px;
      background: linear-gradient(90deg, var(--accent, var(--neon-cyan)), var(--neon-pink));
      box-shadow: 0 0 16px var(--accent, var(--neon-cyan));
    }

    .card-main {
      padding: clamp(16px, 3vw, 24px);
      display: grid;
      gap: 18px;
    }

    .route-title {
      display: flex;
      align-items: start;
      justify-content: space-between;
      gap: 14px;
    }

    .route-title h3 {
      margin: 0;
      font-family: var(--display-font);
      font-size: clamp(2rem, 5.3vw, 3.65rem);
      line-height: 0.9;
      font-weight: 600;
      text-transform: none;
      text-shadow: 0 0 16px rgba(0, 229, 255, 0.18);
    }

    .pill {
      font-family: var(--display-font);
      display: inline-flex;
      align-items: center;
      min-height: 30px;
      padding: 5px 10px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(255, 255, 255, 0.055);
      color: var(--muted);
      font-size: 1rem;
      line-height: 1;
      font-weight: 600;
      text-transform: none;
      white-space: nowrap;
    }

    .pill.good {
      color: #7dffc7;
      background: rgba(47, 255, 166, 0.12);
      border-color: rgba(47, 255, 166, 0.2);
    }

    .pill.delay {
      color: var(--red);
      background: rgba(255, 79, 123, 0.14);
      border-color: rgba(255, 79, 123, 0.22);
    }

    .pill.cancelled {
      color: var(--red);
      background: rgba(255, 79, 123, 0.14);
      border-color: rgba(255, 79, 123, 0.22);
    }

    .pill.loading {
      color: var(--muted);
      background: rgba(148, 168, 186, 0.1);
    }

    .primary-times {
      display: grid;
      grid-template-columns: 1fr;
      gap: 18px;
      align-items: start;
    }

    .service-list {
      display: grid;
      gap: 12px;
    }

    .service-option,
    .return-journey {
      display: grid;
      gap: 12px;
      padding: 13px 12px;
      border-radius: 6px;
      background: rgba(0, 0, 0, 0.38);
      border: 1px solid rgba(0, 229, 255, 0.1);
    }

    .service-option + .service-option,
    .return-journey + .return-journey {
      border-top: 1px solid var(--line);
    }

    .service-topline,
    .journey-topline {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: start;
      gap: 12px;
    }

    .departure {
      display: grid;
      gap: 5px;
    }

    .label {
      color: var(--muted);
      font-family: var(--display-font);
      font-size: clamp(1rem, 2vw, 1.22rem);
      line-height: 1;
      font-weight: 600;
      text-transform: none;
    }

    .big-time {
      font-family: var(--display-font);
      font-variant-numeric: tabular-nums;
      font-size: clamp(3.2rem, 8.6vw, 6.4rem);
      line-height: 0.82;
      font-weight: 600;
      color: var(--board-amber);
      text-shadow: 0 0 10px rgba(255, 230, 109, 0.28), 0 0 28px rgba(255, 42, 213, 0.1);
    }

    .leave-box {
      width: 100%;
      min-width: 0;
      padding: 13px 14px;
      border: 1px solid rgba(0, 229, 255, 0.24);
      border-radius: var(--radius);
      background: rgba(0, 229, 255, 0.06);
      box-shadow: inset 0 0 18px rgba(0, 229, 255, 0.035);
      text-align: left;
    }

    .leave-value {
      color: var(--text);
      font-family: var(--display-font);
      font-size: clamp(1.55rem, 3.7vw, 2.55rem);
      line-height: 0.98;
      font-weight: 600;
      text-shadow: 0 0 14px rgba(0, 229, 255, 0.18);
    }

    .leave-note {
      margin-top: 6px;
      color: var(--muted);
      font-size: 0.78rem;
      font-weight: 620;
      text-transform: none;
    }

    .arrivals {
      display: grid;
      gap: 8px;
    }

    .service-option .arrivals {
      gap: 6px;
    }

    .service-option .big-time {
      font-size: clamp(2.8rem, 7vw, 4.8rem);
    }

    .service-option .leave-value {
      font-size: clamp(1.35rem, 3.2vw, 2.05rem);
    }

    .service-option .arrival-row {
      min-height: 36px;
      padding: 7px 10px;
      background: rgba(255, 255, 255, 0.035);
    }

    .arrival-row,
    .return-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 14px;
      min-height: 42px;
      padding: 9px 12px;
      border-radius: 6px;
      background: var(--row);
      border: 1px solid rgba(255, 255, 255, 0.04);
    }

    .arrival-destination > span,
    .boarding-station strong,
    .return-row span:first-child {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--text);
      font-family: var(--display-font);
      font-size: clamp(1.2rem, 2.4vw, 1.55rem);
      line-height: 0.98;
      font-weight: 600;
      text-shadow: 0 0 12px rgba(0, 229, 255, 0.12);
    }

    .arrival-destination,
    .boarding-station {
      min-width: 0;
      display: grid;
      gap: 3px;
    }

    .tube-note {
      --tube: var(--board-blue);
      display: inline-flex;
      align-items: center;
      width: fit-content;
      max-width: 100%;
      min-height: 22px;
      padding: 3px 8px 3px 7px;
      border-left: 4px solid var(--tube);
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.06);
      color: #ffd1cf;
      font-size: clamp(0.72rem, 1.45vw, 0.82rem);
      font-weight: 700;
      line-height: 1.18;
      white-space: normal;
      box-shadow: 0 0 12px color-mix(in srgb, var(--tube), transparent 72%);
    }

    .tube-note.muted {
      color: var(--muted);
    }

    .tube-note.good {
      color: #d9fff0;
    }

    .tube-note.line-victoria {
      --tube: #0098d4;
    }

    .tube-note.line-bakerloo {
      --tube: #b36305;
    }

    .tube-note.line-northern {
      --tube: #ffffff;
    }

    .tube-note.line-piccadilly {
      --tube: #003688;
    }

    .tube-note.line-central {
      --tube: #e32017;
    }

    .tube-note.line-liverpool {
      --tube: #6950a1;
      border-left-color: transparent;
      background:
        linear-gradient(90deg, #6950a1 0 4px, #ffd300 4px 8px, #f3a9bb 8px 12px, #9b0056 12px 16px, rgba(255, 255, 255, 0.07) 16px);
      padding-left: 22px;
    }

    .arrival-time,
    .return-time {
      font-family: var(--display-font);
      font-variant-numeric: tabular-nums;
      color: var(--text);
      font-size: clamp(1.35rem, 2.6vw, 1.75rem);
      line-height: 0.95;
      font-weight: 600;
      white-space: nowrap;
      text-shadow: 0 0 12px rgba(0, 229, 255, 0.12);
    }

    .return-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: clamp(12px, 2vw, 18px);
    }

    .return-card {
      min-height: 0;
    }

    .return-card .card-main {
      gap: 18px;
    }

    .return-title {
      display: flex;
      align-items: start;
      justify-content: space-between;
      gap: 14px;
    }

    .return-title h3 {
      margin: 0;
      font-family: var(--display-font);
      font-size: clamp(2rem, 5.3vw, 3.65rem);
      line-height: 0.9;
      font-weight: 600;
      text-transform: none;
    }

    .return-route-list {
      display: grid;
      gap: 9px;
    }

    .journey-boardings {
      display: grid;
      gap: 7px;
    }

    .journey-boarding-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto auto;
      align-items: center;
      gap: 12px;
      min-height: 40px;
      padding: 8px 10px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.035);
      border: 1px solid rgba(0, 229, 255, 0.08);
    }

    .journey-boarding-row strong {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-family: var(--display-font);
      font-size: clamp(1.2rem, 2.4vw, 1.55rem);
      line-height: 0.98;
    }

    .return-station-row {
      display: grid;
      grid-template-columns: minmax(0, 1.25fr) auto minmax(220px, auto) auto;
      align-items: center;
      gap: 14px;
      min-height: 58px;
      padding: 11px 12px;
      border-radius: 6px;
      background: var(--row);
      border: 1px solid rgba(255, 255, 255, 0.04);
    }

    .return-station {
      min-width: 0;
    }

    .return-station strong,
    .return-mini strong {
      display: block;
      color: var(--text);
      font-family: var(--display-font);
      font-size: clamp(1.35rem, 2.6vw, 1.75rem);
      line-height: 0.95;
      font-weight: 600;
      white-space: nowrap;
    }

    .return-station strong {
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .return-mini {
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    .return-mini.arrival-cell {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 18px;
      padding: 8px 10px;
      border: 1px solid rgba(0, 229, 255, 0.24);
      border-radius: 6px;
      background: rgba(0, 229, 255, 0.06);
      text-align: left;
    }

    .return-mini.arrival-cell .mini-label,
    .return-mini.arrival-cell strong {
      color: var(--text);
    }

    .return-mini.arrival-cell .mini-label {
      margin-bottom: 0;
      white-space: nowrap;
    }

    .mini-label {
      display: block;
      margin-bottom: 2px;
      color: var(--muted);
      font-family: var(--display-font);
      font-size: 0.98rem;
      line-height: 1;
      font-weight: 600;
    }

    .return-departure {
      display: grid;
      gap: 6px;
      padding: 13px 0 2px;
    }

    .return-departure .big-time {
      font-size: clamp(2.8rem, 7vw, 5rem);
    }

    .divider {
      height: 1px;
      background: var(--line);
    }

    .small-list {
      display: grid;
      gap: 7px;
    }

    .footer {
      display: flex;
      justify-content: flex-start;

    const timeFormat = new Intl.DateTimeFormat("en-GB", {

      hour12: false

    const dateFormat = new Intl.DateTimeFormat("en-GB", {
      weekday: "short",

    });

    const API_BASE = "https://api.traini.ac/api";
    const WORKER_API_BASE = "https://carshalton-rail-api.renata-pop05.workers.dev";
    const CRS = {
      carshalton: "CSH",
      victoria: "VIC",
      balham: "BAL",
      elephant: "EPH",
      cityThameslink: "CTK",
      farringdon: "ZFD",
      stPancrasThameslink: "SPL",
      stAlbans: "SAC"
    };

    const directBackOrigins = [
      { station: "Victoria", crs: CRS.victoria, accent: "#0098d4" },
      { station: "Balham", crs: CRS.balham, accent: "#000000" },
      { station: "Elephant & Castle", crs: CRS.elephant, accent: "#b36305" },
      { station: "City Thameslink", crs: CRS.cityThameslink, accent: "#e64097" },
      { station: "Farringdon", crs: CRS.farringdon, accent: "#6950a1" },
      { station: "St Pancras", crs: CRS.stPancrasThameslink, accent: "#003688" }
    ];

    const returnMinimumLeadMinutes = {
      [CRS.balham]: 20,
      [CRS.elephant]: 20
    };

    const directBackGroups = [
      {
        name: "Victoria",
        accent: "#0098d4",
        origins: [CRS.victoria, CRS.balham]
      },
      {
        name: "St Albans line",
        accent: "#e64097",
        origins: [CRS.stPancrasThameslink, CRS.farringdon, CRS.cityThameslink, CRS.elephant]
      }
    ];

    function minutesSinceMidnight(date) {
      return date.getHours() * 60 + date.getMinutes();
    }

    function addMinutes(date, minutes) {
      return new Date(date.getTime() + minutes * 60000);
    }

    function sleep(ms) {
      return new Promise((resolve) => window.setTimeout(resolve, ms));
    }

    function cacheRead(key) {
      try {
        const cached = JSON.parse(window.localStorage.getItem("carshalton:" + key) || "null");
        if (!cached || Date.now() - cached.savedAt > CACHE_TTL_MS) return null;
        return cached.data;
      } catch {
        return null;
      }
    }

    function cacheWrite(key, data) {
      try {
        window.localStorage.setItem("carshalton:" + key, JSON.stringify({
          savedAt: Date.now(),
          data
        }));
      } catch {
        // Storage is an optional speed-up only.
      }
    }

    function readRailAlertHistory() {
      try {
        const history = JSON.parse(window.localStorage.getItem("carshalton:rail-alert-history") || "[]");
        return history.filter((item) => Date.now() - item.seenAt < RAIL_ALERT_WINDOW_MS);
      } catch {
        return [];
      }
    }

    function writeRailAlertHistory(history) {
      try {
        window.localStorage.setItem("carshalton:rail-alert-history", JSON.stringify(history.slice(-60)));
      } catch {
        // Alert history is a convenience only.
      }
    }

    function rememberRailAlerts(entries) {
      if (!entries.length) return;
      const history = readRailAlertHistory();
      const seenKeys = new Set(history.map((item) => item.key));
      entries.forEach((entry) => {
        if (!seenKeys.has(entry.key)) {
          history.push({ ...entry, seenAt: Date.now() });
        }
      });
      writeRailAlertHistory(history.filter((item) => Date.now() - item.seenAt < RAIL_ALERT_WINDOW_MS));
    }

    async function trainiac(path, params = {}, maxAttempts = 3) {
      const url = new URL(API_BASE + path);
      Object.entries(params).forEach(([key, value]) => {
        if (value !== undefined && value !== null) {
          url.searchParams.set(key, value);
        }
      });

      for (let attempt = 0; attempt < maxAttempts; attempt += 1) {
        const controller = new AbortController();
        const timeout = window.setTimeout(() => controller.abort(), 10000);

        try {
          const response = await fetch(url, {
            headers: { Accept: "application/json" },
            cache: "no-store",
            signal: controller.signal
          });

          if (response.ok) {
            return response.json();
          }

          if ((response.status === 429 || response.status === 503) && attempt < maxAttempts - 1) {
            try {
              const error = await response.json();
              await sleep(Number(error.retry_after_seconds || 1) * 1000);
            } catch {
              await sleep(1200);
            }
            continue;
          }

          throw new Error("traini.ac unavailable");
        } catch (error) {
          if (attempt < maxAttempts - 1) {
            await sleep(1200);
            continue;
          }
          throw error;
        } finally {
          window.clearTimeout(timeout);
        }
      }

      throw new Error("traini.ac unavailable");
    }

    function directCallingPoints(service) {
      return Array.isArray(service?.calling_points) ? service.calling_points : [];
    }

    function directCrsMatches(item, crs) {
      return String(item?.crs || item?.station?.crs || "").toUpperCase() === crs;
    }

    function directHasCallingPoint(service, crs) {
      return directCallingPoints(service).some((point) => directCrsMatches(point, crs));
    }

    function directDestinationMatches(service, crs) {
      return directCrsMatches(service.destination, crs) || directCrsMatches(service.arrival_station, crs);
    }

    function directFindPoint(service, crs) {
      return directCallingPoints(service).find((point) => directCrsMatches(point, crs));
    }

    function dateForIso(value) {
      if (!value) return null;
      const date = new Date(value);
      return Number.isNaN(date.getTime()) ? null : date;
    }

    function displayIsoTime(value) {
      const date = dateForIso(value);
      return date ? timeFormat.format(date) : "TBC";
    }

    function classifyLine(value = "") {
      const text = String(value).toLowerCase();
      if (text.includes("thameslink") || text.includes("st albans") || text.includes("bedford") ||
          text.includes("farringdon") || text.includes("city thameslink") || text.includes("st pancras") ||
          text.includes("elephant")) {
        return "St Albans line";
      }
      if (text.includes("southern") || text.includes("victoria") || text.includes("balham") ||
          text.includes("sutton") || text.includes("epsom")) {
        return "Victoria";
      }
      return null;
    }

    function lineFromRailItem(item) {
      return classifyLine([
        item.operator,
        item.origin?.name || item.origin,
        item.destination?.name || item.destination,
        item.last_location,
        item.reason
      ].filter(Boolean).join(" "));
    }

    function liveDepartureIso(service) {
      return service.expected_departs || service.departs;
    }

    function liveArrivalIso(service) {
      return service.expected_arrives || service.arrives;
    }

    function platformLabel(platform) {
      if (!platform) return "Platform TBC";
      if (String(platform).toUpperCase() === "BUS") return "BUS";
      return /^\d+$/.test(String(platform)) ? "P" + platform : String(platform);
    }

    function directServiceStatus(service) {
      if (service.status === "cancelled") {
        return { statusType: "cancelled", statusLabel: "Cancelled", delayMinutes: null };
      }

      const scheduled = dateForIso(service.departs);
      const estimated = dateForIso(service.expected_departs);
      const fallbackDelay = Number.isFinite(service.lateness_minutes) ? service.lateness_minutes : 0;
      const delayMinutes = scheduled && estimated
        ? Math.max(0, Math.round((estimated.getTime() - scheduled.getTime()) / 60000))
        : Math.max(0, fallbackDelay);

      if (delayMinutes > 0) {
        return { statusType: "delay", statusLabel: "+" + delayMinutes + " min", delayMinutes };
      }

      if (String(service.status || "").includes("delay")) {
        return { statusType: "delay", statusLabel: "Delayed", delayMinutes: null };
      }

      const statusText = String(service.status_text || "").toLowerCase();
      if ((!service.expected_departs && !service.expected_arrives) || statusText.includes("no live report") || service.data_source === "timetable") {
        return { statusType: "good", statusLabel: "Scheduled", delayMinutes: null };
      }

      return { statusType: "good", statusLabel: "On time", delayMinutes: 0 };
    }

    function isTrustworthyPassengerService(service) {
      if (service.status === "cancelled") return true;
      if (service.expected_departs || service.expected_arrives) return true;
      if (Number.isFinite(service.lateness_minutes)) return true;
      return true;
    }

    function hasEngineeringWorkPattern(board) {
      const services = board.results || [];
      const hasReplacementBus = services.some((service) => service.service_class === "bus");
      const hasCancelledPassenger = services.some((service) =>
        service.service_class === "passenger" && service.status === "cancelled"
      );
      return hasReplacementBus && hasCancelledPassenger;
    }

    function livePassengerServices(board) {
      const engineeringWork = hasEngineeringWorkPattern(board);
      return (board.results || []).filter((service) =>
        service.service_class === "passenger" &&
        !service.not_for_display &&
        (!engineeringWork || service.status === "cancelled") &&
        isTrustworthyPassengerService(service)
      );
    }

    function pointTime(point) {
      return point ? displayIsoTime(point.expected || point.scheduled) : null;
    }

    function sortedUpcomingServices(services, now, minimumLeadMinutes = 0) {
      return services
        .map((service) => ({
          service,
          departureDate: dateForIso(liveDepartureIso(service))
        }))
        .filter(({ departureDate }) =>
          departureDate && departureDate.getTime() - now.getTime() > minimumLeadMinutes * 60000
        )
        .sort((a, b) => a.departureDate - b.departureDate)
        .map(({ service }) => service);
    }

    function normalizeDirectOutService(service, stops) {
      if (!service) {
        return {
          platform: "Platform TBC",
          departureTime: "TBC",
          departureIso: null,
          statusType: "cancelled",
          statusLabel: "No train service",
          delayMinutes: null,
          arrivals: stops.map((stop) => ({ name: stop.name, time: "TBC" }))
        };
      }

      const status = directServiceStatus(service);
      const departureIso = liveDepartureIso(service);

      return {
        platform: platformLabel(service.platform),
        departureTime: displayIsoTime(departureIso),
        departureIso,
        ...status,
        arrivals: stops.map((stop) => {
          const point = directFindPoint(service, stop.crs);
          return { name: stop.name, time: pointTime(point) || "TBC" };
        })
      };
    }

    function normalizeDirectOutRoute(name, services, stops, accent) {
      const options = services.slice(0, 2).map((service) => normalizeDirectOutService(service, stops));
      if (!options.length) {
        options.push(normalizeDirectOutService(null, stops));
      }

      return {
        name,
        accent,
        services: options,
        ...options[0]
      };
    }

    function normalizeDirectBackStation(origin, service) {
      if (!service) {
        return {
          station: origin.station,
          crs: origin.crs,
          accent: origin.accent,
          statusType: "delay",
          statusLabel: "No direct train",
          platform: "Platform TBC",
          departureTime: "TBC",
          departureIso: null,
          arrivalTime: "TBC",
          arrivalIso: null
        };
      }

      const arrivalPoint = directFindPoint(service, CRS.carshalton);
      const status = directServiceStatus(service);
      const departureIso = liveDepartureIso(service);
      const arrivalIso = arrivalPoint ? (arrivalPoint.expected || arrivalPoint.scheduled) : liveArrivalIso(service);

      return {
        station: origin.station,
        crs: origin.crs,
        accent: origin.accent,
        platform: platformLabel(service.platform),
        departureTime: displayIsoTime(departureIso),
        departureIso,
        arrivalTime: displayIsoTime(arrivalIso),
        arrivalIso,
        ...status
      };
    }

    function selectDirectBackServices(origin, board, now) {
      const services = livePassengerServices(board);
      const minimumLeadMinutes = returnMinimumLeadMinutes[origin.crs] || 0;
      return sortedUpcomingServices(services, now, minimumLeadMinutes).slice(0, 2);
    }

    function backStationPlaceholder(origin) {
      return {
        station: origin.station,
        crs: origin.crs,
        accent: origin.accent,
        pending: true,
        statusType: "loading",
        statusLabel: "Checking",
        platform: "",
        departureTime: "--:--",
        departureIso: null,
        arrivalTime: "--:--",
        arrivalIso: null
      };
    }

    function backStationUnavailable(origin) {
      return {
        station: origin.station,
        crs: origin.crs,
        accent: origin.accent,
        unavailable: true,
        statusType: "delay",
        statusLabel: "Could not load",
        platform: "",
        departureTime: "--:--",
        departureIso: null,
        arrivalTime: "--:--",
        arrivalIso: null
      };
    }

    function backRoutesFromStations(stations) {
      const stationsByCrs = new Map(stations.map((station) => [station.crs, station]));
      return directBackGroups.map((route) => ({
        name: route.name,
        accent: route.accent,
        stations: route.origins.map((crs) =>
          stationsByCrs.get(crs) || backStationPlaceholder(directBackOrigins.find((origin) => origin.crs === crs))
        )
      }));
    }

    function backRoutesFromStationOptions(stationOptions) {
      const optionsByCrs = new Map(stationOptions.map((station) => [station.crs, station]));

      return directBackGroups.map((route) => {
        const anchorCrs = route.origins[0];
        const anchorOptions = optionsByCrs.get(anchorCrs)?.options || [];
        const journeys = anchorOptions.slice(0, 2).map((anchorOption) => {
          const key = anchorOption.arrivalIso || anchorOption.arrivalTime;
          const boardings = route.origins.map((crs) => {
            const station = optionsByCrs.get(crs);
            return (station?.options || []).find((option) =>
              (option.arrivalIso || option.arrivalTime) === key
            );
          }).filter(Boolean).sort((a, b) => {
            const aTime = dateForIso(a.departureIso);
            const bTime = dateForIso(b.departureIso);
            return (aTime?.getTime() || 0) - (bTime?.getTime() || 0);
          });

          return {
            arrivalIso: anchorOption.arrivalIso,
            arrivalTime: anchorOption.arrivalTime,
            statusType: anchorOption.statusType,
            statusLabel: anchorOption.statusLabel,
            boardings: boardings.map((option) => ({
              station: option.station,
              crs: option.crs,
              departureTime: option.departureTime,
              departureIso: option.departureIso,
              platform: option.platform,
              statusType: option.statusType,
              statusLabel: option.statusLabel
            }))
          };
        });

        return {
          name: route.name,
          accent: route.accent,
          journeys
        };
      });
    }

    function mergeBackStation(station) {
      const existing = Array.isArray(liveBoard?.backStations) ? liveBoard.backStations : [];
      const stationsByCrs = new Map(existing.map((item) => [item.crs, item]));
      stationsByCrs.set(station.crs, station);
      const backStationsLive = directBackOrigins.map((origin) =>
        stationsByCrs.get(origin.crs) || backStationPlaceholder(origin)
      );
      mergeLiveBoard({
        source: "traini.ac",
        generatedAt: liveBoard?.generatedAt || new Date().toISOString(),
        checkedAt: new Date().toISOString(),
        refreshAfterSeconds: 60,
        backStations: backStationsLive,
        backRoutes: backRoutesFromStations(backStationsLive)
      });
    }

    function directOutRoutesFromBoard(outboundBoard) {
      const now = new Date();
      const outbound = livePassengerServices(outboundBoard);
      const victoriaServices = sortedUpcomingServices(outbound.filter((service) =>
        directDestinationMatches(service, CRS.victoria) || directHasCallingPoint(service, CRS.victoria)
      ), now).slice(0, 2);
      const stAlbansServices = sortedUpcomingServices(outbound.filter((service) =>
        directDestinationMatches(service, CRS.stAlbans) ||
        [CRS.elephant, CRS.cityThameslink, CRS.farringdon, CRS.stPancrasThameslink, CRS.stAlbans].some((crs) =>
          directHasCallingPoint(service, crs)
        )
      ), now).slice(0, 2);

      return [
        normalizeDirectOutRoute(
          "Victoria",
          victoriaServices,
          [
            { name: "Balham", crs: CRS.balham },
            { name: "London Victoria", crs: CRS.victoria }
          ],
          "#040457"
        ),
        normalizeDirectOutRoute(
          "St Albans line",
          stAlbansServices,
          [
            { name: "Elephant & Castle", crs: CRS.elephant },
            { name: "City Thameslink", crs: CRS.cityThameslink },
            { name: "Farringdon", crs: CRS.farringdon },
            { name: "St Pancras", crs: CRS.stPancrasThameslink },
            { name: "St Albans City", crs: CRS.stAlbans }
          ],
          "#8fb5c8"
        )
      ];
    }

    async function buildDirectOutBoard() {
      const outboundBoard = await trainiac("/departures/" + CRS.carshalton, { limit: 30 }, 2);
      return {
        source: "traini.ac",
        generatedAt: outboundBoard.generated_at || new Date().toISOString(),
        checkedAt: new Date().toISOString(),
        refreshAfterSeconds: REFRESH_SECONDS,
        outRoutes: directOutRoutesFromBoard(outboundBoard)
      };
    }

    async function buildDirectBackStation(origin, now) {
      const board = await trainiac("/departures/" + origin.crs, {
        limit: 20,
        calling_at: CRS.carshalton
      }, 1);
      const services = selectDirectBackServices(origin, board, now);
      return {
        station: {
          station: origin.station,
          crs: origin.crs,
          accent: origin.accent,
          options: services.map((service) => normalizeDirectBackStation(origin, service))
        },
        generatedAt: board.generated_at || new Date().toISOString()
      };
    }

    async function buildDirectBackBoard(progressive = false) {
      const now = new Date();

      if (progressive) {
        const startingStations = directBackOrigins.map((origin) =>
          backStationPlaceholder(origin)
        );
        mergeLiveBoard({
          source: "traini.ac",
          generatedAt: new Date().toISOString(),
          checkedAt: new Date().toISOString(),
          refreshAfterSeconds: REFRESH_SECONDS,
          backStations: startingStations,
          backRoutes: backRoutesFromStations(startingStations)
        });
        boardState = "live";
        render();
      }

      const freshStations = [];
      let generatedAt = new Date().toISOString();

      for (const origin of directBackOrigins) {
        const result = await buildDirectBackStation(origin, now);
        generatedAt = result.generatedAt || generatedAt;
        freshStations.push(result.station);
        if (progressive) {
          mergeBackStation(result.station);
          liveBoard.generatedAt = generatedAt;
          render();
        }
      }

      if (freshStations.length !== directBackOrigins.length) {
        throw new Error("traini.ac unavailable");
      }

      const backStationsLive = directBackOrigins.map((origin) =>
        freshStations.find((station) => station.crs === origin.crs) || backStationPlaceholder(origin)
      );

      return {
        source: "traini.ac",
        generatedAt,
        checkedAt: new Date().toISOString(),
        refreshAfterSeconds: REFRESH_SECONDS,
        backStations: backStationsLive,
        backRoutes: backRoutesFromStationOptions(backStationsLive)
      };
    }

    async function buildDirectBoard(view = currentView()) {
      return view === "back" ? buildDirectBackBoard(false) : buildDirectOutBoard();
    }

    async function fetchWeatherNote() {
      try {
        const url = new URL("https://api.open-meteo.com/v1/forecast");
        url.searchParams.set("latitude", "51.37");
        url.searchParams.set("longitude", "-0.17");
        url.searchParams.set("hourly", "precipitation_probability,precipitation,rain");
        url.searchParams.set("timezone", "Europe/London");
        url.searchParams.set("forecast_days", "1");

        const response = await fetch(url, { cache: "no-store" });
        if (!response.ok) throw new Error("Weather unavailable");
        const data = await response.json();
        const hourly = data.hourly || {};
        const now = new Date();
        const rainIndex = (hourly.time || []).findIndex((time, index) => {
          const date = new Date(time);
          const probability = Number(hourly.precipitation_probability?.[index] || 0);
          const precipitation = Number(hourly.precipitation?.[index] || 0);
          const rain = Number(hourly.rain?.[index] || 0);
          return date >= now && (probability >= 45 || precipitation > 0.1 || rain > 0.1);
        });

        if (rainIndex >= 0) {
          weatherNote = {
            type: "warn",
            text: "It's raining at " + timeFormat.format(new Date(hourly.time[rainIndex])) + "... grab ☂️"
          };
        } else {
          weatherNote = { type: "good", text: "No umbrella needed 🏝️" };
        }
      } catch {
        weatherNote = { type: "muted", text: "Weather unavailable right now" };
      }
      renderNotices();
    }

    function nextService(now, config) {
      const currentMinute = new Date(now);
      currentMinute.setSeconds(0, 0);
      const candidates = [];
      const sorted = [...config.departures].sort((a, b) => a - b);

      for (let hourOffset = -1; hourOffset <= 2; hourOffset += 1) {
        for (const minute of sorted) {
          const scheduled = new Date(now);
          scheduled.setHours(now.getHours() + hourOffset, minute, 0, 0);
          const indexSeed = Math.floor(minutesSinceMidnight(scheduled) / 30);
          const delay = config.delayPattern[indexSeed % config.delayPattern.length];
          const estimated = addMinutes(scheduled, delay);

          if (estimated >= currentMinute) {
            candidates.push({ scheduled, estimated, delay });
          }
        }
      }

      candidates.sort((a, b) => a.estimated - b.estimated);
      return candidates[0];
    }

    function statusClass(delay) {
      if (delay === "loading") return "loading";
      if (delay === "cancelled") return "cancelled";
      if (delay === "delay") return "delay";
      if (delay === "good") return "good";
      if (delay >= 5) return "delay";
      if (delay > 0) return "delay";
      return "good";
    }

    function statusText(delay) {
      if (delay === 0) return "On time";
      return "+" + delay + " min";
    }

    function leaveText(now, estimated) {
      const mins = Math.ceil((estimated.getTime() - now.getTime()) / 60000) - WALK_MINUTES;
      if (mins > 1) return "Leave house in " + mins + " minutes";
      if (mins === 1) return "Leave house in 1 minute";
      if (mins >= -2) return "Leave house now";
      return "Too tight";
    }

    function liveLeaveText(route, departureDate, now) {
      if (route.statusLabel === "No train service") return "No train service";
      if (route.statusType === "cancelled") return "Cancelled";
      return departureDate ? leaveText(now, departureDate) : "Check board";
    }

    function tubeMarkup(tube) {
      if (!tube) return "";
      const classes = ["tube-note"];
      if (tube.statusType === "muted") classes.push("muted");
      if (tube.statusType === "good") classes.push("good");
      const lineClass = tubeLineClass(tube.name);
      if (lineClass) classes.push(lineClass);
      const reason = tube.reason ? " - " + tube.reason : "";
      return `<span class="${classes.join(" ")}">${tube.name}: ${tube.statusLabel}${reason}</span>`;
    }

    function tubeLineClass(name = "") {
      const value = String(name).toLowerCase();
      if (value.includes("victoria")) return "line-victoria";
      if (value.includes("bakerloo")) return "line-bakerloo";
      if (value.includes("northern")) return "line-northern";
      if (value.includes("piccadilly")) return "line-piccadilly";
      if (value.includes("central")) return "line-central";
      if (value.includes("liverpool street")) return "line-liverpool";
      return "";
    }

    function routeAccent(route) {
      const name = String(route?.name || "").toLowerCase();
      if (name.includes("victoria")) return "#0098d4";
      if (name.includes("st albans")) return "#e64097";
      return route?.accent || "var(--board-blue)";
    }

    function boardStateMarkup(title, copy, isLoading = false) {
      return `
        <div class="board-state" role="status" aria-live="polite">
          ${isLoading ? '<div class="loading-cog" aria-hidden="true"></div>' : ""}
          <div>
            <div class="state-title">${title}</div>
            ${copy ? `<div class="state-copy">${copy}</div>` : ""}
          </div>
        </div>
      `;
    }

    function setNotice(element, note) {
      if (!element) return;
      if (!note) {
        element.className = "notice muted is-hidden";
        element.textContent = "";
        return;
      }
      element.className = "notice " + (note.type || "muted");
      element.textContent = note.text;
      if (note.url) {
        const link = document.createElement("a");
        link.href = note.url;
        link.target = "_blank";
        link.rel = "noopener";
        link.textContent = note.linkText || "National Rail";
        element.append(" ");
        element.append(link);
      }
    }

    function updateRailAlertNotes() {
      const quiet = {
        type: "good",
        text: "No issues on les trains"
      };
      const checkingOut = {
        type: "muted",
        text: "Checking heading out rail conditions"
      };
      const checkingBack = {
        type: "muted",
        text: "Checking heading back rail conditions"
      };
      railAlertNote = {
        out: liveBoard?.railHealth?.out || (boardState === "live" ? quiet : checkingOut),
        back: liveBoard?.railHealth?.back || (boardState === "live" ? quiet : checkingBack)
      };
    }

    function renderNotices() {
      setNotice(els.weatherNotice, weatherNote);
      setNotice(els.outTubeNotice, liveBoard?.tubeHealth || null);
      setNotice(els.backTubeNotice, liveBoard?.tubeHealth || null);
      updateRailAlertNotes();
      setNotice(els.outDisruptionNotice, railAlertNote.out);
      setNotice(els.backDisruptionNotice, railAlertNote.back);
    }

    function renderOut(now) {
      if (boardState === "error" && !hasLiveData("out")) {
        els.outCards.innerHTML = boardStateMarkup("Live data paused", "Rail Data is unavailable right now. Retrying shortly.");
        return;
      }

      if (liveBoard && Array.isArray(liveBoard.outRoutes)) {
        els.outCards.innerHTML = liveBoard.outRoutes.map((route) => {
          const services = route.services || [route];
          const serviceCards = services.map((service, index) => {
            const departureDate = service.departureIso ? new Date(service.departureIso) : null;
            const rows = (service.arrivals || []).map((arrival) => `
              <div class="arrival-row">
                <div class="arrival-destination">
                  <span>${arrival.name}</span>
                  ${tubeMarkup(arrival.tube)}
                </div>
                <span class="arrival-time">${arrival.time}</span>
              </div>
            `).join("");

            return `
              <div class="service-option">
                <div class="service-topline">
                  <div class="departure">
                    <span class="label">${index === 0 ? "Next train" : "Train after"}</span>
                    <span class="big-time">${service.departureTime}</span>
                  </div>
                  <span class="pill ${statusClass(service.statusType)}">${service.statusLabel} | ${service.platform}</span>
                </div>
                <div class="leave-box">
                  <div class="leave-value">${liveLeaveText(service, departureDate, now)}</div>
                </div>
                <div class="arrivals">${rows}</div>
              </div>
            `;
          }).join("");

          return `
            <article class="route-card" style="--accent:${routeAccent(route)}">
              <div class="card-main">
                <div class="route-title">
                  <h3>${route.name}</h3>
                </div>
                <div class="service-list">${serviceCards}</div>
              </div>
            </article>
          `;
        }).join("");
        return;
      }

      els.outCards.innerHTML = boardState === "offline"
        ? boardStateMarkup("Live data needs the web version", "Open this through the local preview or GitHub Pages so it can check Rail Data.")
        : boardState === "error"
          ? boardStateMarkup("Live data paused", "Rail Data is unavailable right now. Retrying shortly.")
        : boardStateMarkup("Loading live departures", "Checking Rail Data before showing any trains.", true);
    }

    function renderBack(now) {
      if (boardState === "error" && !hasLiveData("back")) {
        els.backCards.innerHTML = boardStateMarkup("Live data paused", "Rail Data is unavailable right now. Retrying shortly.");
        return;
      }

      if (liveBoard && Array.isArray(liveBoard.backRoutes)) {
        els.backCards.innerHTML = liveBoard.backRoutes.map((route) => {
          const rows = Array.isArray(route.journeys) ? route.journeys.map((journey, index) => {
            const boardings = journey.boardings.map((boarding) => `
              <div class="journey-boarding-row">
                <div class="boarding-station">
                  <strong>${boarding.station}</strong>
                  ${tubeMarkup(boarding.tube)}
                </div>
                <span class="return-time">${boarding.departureTime}</span>
                <span class="pill ${statusClass(boarding.statusType)}">${boarding.platform ? boarding.statusLabel + " | " + boarding.platform : boarding.statusLabel}</span>
              </div>
            `).join("");

            return `
              <div class="return-journey">
                <div class="journey-topline">
                  <div>
                    <span class="mini-label">${index === 0 ? "Next train" : "Train after"}</span>
                    <div class="journey-boardings">${boardings}</div>
                  </div>
                  <div class="return-mini arrival-cell">
                    <span class="mini-label">Arrives Carshalton</span>
                    <strong>${journey.arrivalTime}</strong>
                  </div>
                </div>
              </div>
            `;
          }).join("") : route.stations.map((origin) => `
              <div class="return-station-row">
                <div class="return-station">
                  <span class="mini-label">From</span>
                  <strong>${origin.station}</strong>
                </div>
                <div class="return-mini">
                  <span class="mini-label">Departs</span>
                  <strong>${origin.departureTime}</strong>
                </div>
                <div class="return-mini arrival-cell">
                  <span class="mini-label">Arrives Carshalton</span>
                  <strong>${origin.arrivalTime}</strong>
                </div>
                <span class="pill ${statusClass(origin.statusType)}">${origin.platform ? origin.statusLabel + " | " + origin.platform : origin.statusLabel}</span>
              </div>
          `).join("");

          return `
            <article class="return-card" style="--accent:${routeAccent(route)}">
              <div class="card-main">
                <div class="return-title">
                  <h3>${route.name}</h3>
                </div>
                <div class="return-route-list">${rows}</div>
              </div>
            </article>
          `;
        }).join("");
        return;
      }

      els.backCards.innerHTML = boardState === "offline"
        ? boardStateMarkup("Live data needs the web version", "Open this through the local preview or GitHub Pages so it can check Rail Data.")
        : boardState === "error"
          ? boardStateMarkup("Live data paused", "Rail Data is unavailable right now. Retrying shortly.")
        : boardStateMarkup("Loading live departures", "Checking Rail Data before showing any trains.", true);
    }

    function renderBackOld(now) {
      els.backCards.innerHTML = backStations.map((origin) => {
        const service = nextService(now, origin);
        const arrival = addMinutes(service.estimated, origin.journey);

        return `
          <article class="return-card" style="--accent:${origin.accent}">
            <div class="card-main">
              <div class="return-title">
                <span class="pill ${statusClass(service.delay)}">${statusText(service.delay)} | ${origin.platform}</span>
                <h3>${origin.station}</h3>
              </div>
              <div class="return-departure">
                <span class="label">Next train</span>
                <span class="big-time">${timeFormat.format(service.estimated)}</span>
              </div>
              <div class="divider"></div>
              <div class="small-list">
                <div class="return-row">
                  <span>Arrives Carshalton</span>
                  <span class="return-time">${timeFormat.format(arrival)}</span>
                </div>
                <div class="return-row">
                  <span>Leaves in</span>
                  <span class="return-time">${Math.ceil((service.estimated - now) / 60000)} min</span>
                </div>
              </div>
            </div>
          </article>
        `;
      }).join("");
    }

    function setView(view) {
      const isBack = view === "back";
      els.outButton.setAttribute("aria-selected", String(!isBack));
      els.backButton.setAttribute("aria-selected", String(isBack));
      els.outView.classList.toggle("active", !isBack);
      els.backView.classList.toggle("active", isBack);
      els.pageTitle.textContent = isBack ? "Heading back" : "Carshalton";
      els.pageKicker.textContent = isBack ? "To CSH from London" : "Heading out from CSH";
      els.headerImage.src = isBack ? headingImages.back.src : headingImages.out.src;
      els.headerImage.alt = isBack ? headingImages.back.alt : headingImages.out.alt;
      window.location.hash = isBack ? "back" : "out";
      if (window.location.protocol !== "file:" && !hasLiveData(view)) {
        fetchLiveBoard(view);
      }
    }

    function currentView() {
      return window.location.hash === "#back" ? "back" : "out";
    }

    function hasLiveData(view) {
      if (view !== "back") {
        return Array.isArray(liveBoard?.outRoutes);
      }
      return Array.isArray(liveBoard?.backStations) &&
        liveBoard.backStations.length === directBackOrigins.length &&
        liveBoard.backStations.every((station) => !station.pending && !station.unavailable);
    }

    function mergeLiveBoard(partial) {
      liveBoard = {
        ...(liveBoard || {}),
        ...partial,
        railHealth: {
          ...(liveBoard?.railHealth || {}),
          ...(partial.railHealth || {})
        },
        source: partial.source || liveBoard?.source,
        generatedAt: partial.generatedAt || liveBoard?.generatedAt,
        checkedAt: partial.checkedAt || new Date().toISOString(),
        refreshAfterSeconds: partial.refreshAfterSeconds || liveBoard?.refreshAfterSeconds || 60
      };
    }

    function dataAgeLabel(checkedAt, now) {
      if (!checkedAt) return "not checked yet";
      const seconds = Math.max(0, Math.floor((now.getTime() - checkedAt.getTime()) / 1000));
      if (seconds < 5) return "checked just now";
      if (seconds < 60) return "checked " + seconds + "s ago";
      const minutes = Math.floor(seconds / 60);
      if (minutes === 1) return "checked 1m ago";
      if (minutes < 60) return "checked " + minutes + "m ago";
      const hours = Math.floor(minutes / 60);
      return hours === 1 ? "checked 1h ago" : "checked " + hours + "h ago";
    }

    function render() {
      const now = new Date();
      const updatedAt = liveBoard?.generatedAt ? new Date(liveBoard.generatedAt) : now;
      const checkedAt = liveBoard?.checkedAt ? new Date(liveBoard.checkedAt) : null;
      const updatedLabel = checkedAt
        ? "Rail data " + timeFormat.format(updatedAt) + " · " + dataAgeLabel(checkedAt, now)
        : boardState === "loading"
          ? "Loading live data"
          : "Updated " + timeFormat.format(updatedAt);
      els.clockTime.textContent = timeFormat.format(now);
      els.clockDate.textContent = dateFormat.format(now);
      els.outUpdated.textContent = updatedLabel;
      els.backUpdated.textContent = updatedLabel;
      els.footerStatus.textContent = liveBoard?.source
        ? "Live via " + liveBoard.source
        : boardState === "offline"
          ? "Open web version for live data"
          : "Checking live data";
      els.buildVersion.textContent = BUILD_VERSION;
      if (els.refreshButton) {
        const isFetching = boardFetches.size > 0;
        els.refreshButton.disabled = isFetching;
        els.refreshButton.textContent = isFetching ? "Refreshing..." : "Refresh trains";
      }
      renderNotices();
      renderOut(now);
      renderBack(now);
    }

    async function fetchLiveBoard(view = currentView(), options = {}) {
      if (boardFetches.has(view)) return;
      boardFetches.add(view);
      try {
        if (options.manual) {
          render();
        }
        const partialBoard = await fetchWorkerBoard(view);

        mergeLiveBoard(partialBoard);
        lastRefreshError = null;
        boardState = "live";
        render();
        window.clearTimeout(refreshTimer);
        refreshTimer = window.setTimeout(() => fetchLiveBoard(currentView()), REFRESH_SECONDS * 1000);
      } catch (error) {
        lastRefreshError = error;
        if (!hasLiveData(view)) {
          boardState = "error";
          render();
        }
        window.clearTimeout(refreshTimer);
        refreshTimer = window.setTimeout(() => fetchLiveBoard(currentView()), REFRESH_SECONDS * 1000);
      } finally {
        boardFetches.delete(view);
        render();
      }
    }

    async function fetchWorkerBoard(view) {
      const response = await fetch(WORKER_API_BASE + "/board?view=" + encodeURIComponent(view) + "&fresh=" + Date.now(), {
        cache: "no-store"
      });
      if (!response.ok) {
        const error = await response.json().catch(() => ({}));
        throw new Error(error.error || "Rail Data unavailable");
      }
      const board = await response.json();
      board.checkedAt = new Date().toISOString();
      return board;
    }

    els.outButton.addEventListener("click", () => setView("out"));
    els.backButton.addEventListener("click", () => setView("back"));
    els.refreshButton.addEventListener("click", () => fetchLiveBoard(currentView(), { manual: true }));

    window.addEventListener("hashchange", () => {
      setView(window.location.hash === "#back" ? "back" : "out");
    });

    render();
    setView(window.location.hash === "#back" ? "back" : "out");
    setInterval(render, 1000);

    fetchWeatherNote();
    window.setInterval(fetchWeatherNote, 30 * 60 * 1000);
    fetchLiveBoard(currentView());
    window.setTimeout(() => window.location.reload(), 6 * 60 * 60 * 1000);
  </script>
</body>
